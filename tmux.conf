# 마우스 클릭, 드래그, 스크롤 활성화
set -g mouse on

# 창(Pane) 이동을 Vim 키바인딩으로 설정 (Ctrl+b -> h,j,k,l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 히스토리 버퍼 크기 확장
set -g history-limit 10000

# 256 Color 및 True Color(RGB) 설정
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc,*:RGB"


# Gruvbox Dark 톤에 맞춘 상태 표시줄
set -g status-style bg='#3c3836',fg='#ebdbb2'

# 좌측 세션 이름 부분 (Gruvbox Yellow 포인트)
set -g status-left "#[bg=#d79921,fg=#282828,bold] #S #[bg=#3c3836,fg=#d79921] "

# 우측 정보 (호스트네임, 시간, 날짜) Gruvbox 톤 적용
set -g status-right "#[fg=#a89984,bg=#3c3836] %Y-%m-%d %H:%M #[fg=#282828,bg=#a89984,bold] #H "

# 현재 활성화된 창(Window) 표시
setw -g window-status-current-style fg='#fe8019',bg='#3c3836',bold
setw -g window-status-current-format " #I:#W#F "

# 비활성 창 표시
setw -g window-status-style fg='#a89984',bg='#3c3836'
setw -g window-status-format " #I:#W "
